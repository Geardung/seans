server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # No caching for auth page
    location = /auth {
        add_header Cache-Control "no-store";
        try_files /auth.html =404;
    }
}