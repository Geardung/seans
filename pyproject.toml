[project]
name = "seans-backend"
version = "0.1.0"
description = "Self-hosted media system backend"
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.34,<1",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30,<1",
    "psycopg2-binary>=2.9,<3",
    "alembic>=1.14,<2",
    "pyjwt>=2.9,<3",
    "passlib[bcrypt]>=1.7,<2",
    "boto3>=1.36,<2",
    "httpx>=0.28,<1",
    "python-multipart>=0.0.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.8,<1",
    "pyright[nodejs]>=1.1,<2",
]

[tool.uv]
package = false

[tool.ruff.lint]
extend-select = ["UP", "I"]
ignore = ["B008", "BLE001", "S110"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]