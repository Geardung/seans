services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: seans
      POSTGRES_USER: seans
      POSTGRES_PASSWORD: ${DB_PASSWORD:-seans}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seans"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: .
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./app:/code/app
      - ./alembic:/code/alembic
    depends_on:
      db:
        condition: service_healthy

  adminer:
    image: adminer
    ports:
      - "8081:8080"

volumes:
  pg_data: