services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: seans
      POSTGRES_USER: seans
      POSTGRES_PASSWORD: ${DB_PASSWORD:-seans}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seans"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: .
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1"
    env_file: .env
    volumes:
      - ./app:/code/app
      - ./alembic:/code/alembic
    depends_on:
      db:
        condition: service_healthy

  adminer:
    image: adminer

  jackett:
    image: linuxserver/jackett:latest
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Europe/Moscow
    volumes:
      - jackett_config:/config

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - adminer
      - jackett

volumes:
  pg_data:
  jackett_config:
  caddy_data:
  caddy_config: