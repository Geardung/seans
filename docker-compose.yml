services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: seans
      POSTGRES_USER: seans
      POSTGRES_PASSWORD: ${DB_PASSWORD:-seans}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seans"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: .
    restart: unless-stopped
    # migrations run in image entrypoint (scripts/docker-entrypoint.sh)
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
    env_file: .env
    volumes:
      - ./app:/code/app
      - ./alembic:/code/alembic
    depends_on:
      db:
        condition: service_healthy

  adminer:
    image: adminer
    restart: unless-stopped

  jacred:
    image: ghcr.io/jacred-fdb/jacred:latest
    restart: unless-stopped
    user: "1000:1000"
    volumes:
      - ./jacred-config:/app/config
      - jacred_data:/app/Data
    expose: ["9117"]
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  frontend:
    build: ./frontend
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend
      - adminer
      - jacred

volumes:
  pg_data:
  caddy_data:
  caddy_config:
  jacred_data:
